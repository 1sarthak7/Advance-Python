<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 260" width="100%" height="100%">
    <!-- Styles for animation -->
    <style>
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .bg-glow-1 {
            animation: pulse 8s ease-in-out infinite;
            transform-origin: 15% 20%;
        }
        .bg-glow-2 {
            animation: pulse 10s ease-in-out infinite alternate;
            transform-origin: 85% 80%;
        }
        .draw-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .fade-in-text {
            opacity: 0;
            animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }
        .float-element {
            animation: float 6s ease-in-out infinite;
        }
    </style>

    <!-- Definitions -->
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F1016" />
            <stop offset="50%" stop-color="#0A0B0E" />
            <stop offset="100%" stop-color="#12131C" />
        </linearGradient>
        
        <!-- Text Gradients -->
        <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#C084FC" /> <!-- Lavender -->
            <stop offset="50%" stop-color="#F472B6" /> <!-- Rose -->
            <stop offset="100%" stop-color="#FCD34D" /> <!-- Gold -->
        </linearGradient>

        <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
            <stop offset="50%" stop-color="#EC4899" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
        </linearGradient>

        <!-- Glow Blur Filter -->
        <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="40" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="830" height="260" rx="16" fill="url(#bg-grad)" />
    <rect width="828" height="258" x="1" y="1" rx="15" fill="none" stroke="#2E303F" stroke-width="1.5" opacity="0.5" />

    <!-- Ambient Glowing Orbs -->
    <circle cx="120" cy="80" r="100" fill="#6366F1" opacity="0.12" filter="url(#glow-blur)" class="bg-glow-1" />
    <circle cx="710" cy="180" r="120" fill="#EC4899" opacity="0.1" filter="url(#glow-blur)" class="bg-glow-2" />

    <!-- Decorative Tech/Grid Accents -->
    <g opacity="0.2">
        <line x1="40" y1="40" x2="120" y2="40" stroke="#8F9BB3" stroke-width="1" />
        <line x1="40" y1="40" x2="40" y2="120" stroke="#8F9BB3" stroke-width="1" />
        <circle cx="40" cy="40" r="3" fill="#8F9BB3" />
        
        <line x1="790" y1="220" x2="710" y2="220" stroke="#8F9BB3" stroke-width="1" />
        <line x1="790" y1="220" x2="790" y2="140" stroke="#8F9BB3" stroke-width="1" />
        <circle cx="790" cy="220" r="3" fill="#8F9BB3" />
    </g>

    <!-- Animated Elegant Geometric Curve (Python Vibe) -->
    <path d="M 150 200 C 250 120, 300 240, 450 150 C 600 60, 650 180, 750 100" 
          fill="none" stroke="url(#line-grad)" stroke-width="2.5" class="draw-line" />

    <!-- Main Content -->
    <g transform="translate(0, 0)">
        <!-- Small Category Tag -->
        <g class="fade-in-text delay-1" transform="translate(415, 75)">
            <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#1E1B4B" stroke="#4338CA" stroke-width="1" />
            <text font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#A5B4FC" letter-spacing="1.5" text-anchor="middle" y="3">ACADEMIC PORTFOLIO</text>
        </g>

        <!-- Main Title: Python Assignment -->
        <text x="415" y="135" 
              font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" 
              fill="url(#text-grad)" letter-spacing="3" text-anchor="middle" 
              class="fade-in-text delay-2">
            PYTHON ASSIGNMENT
        </text>

        <!-- Subtitle/Details: Student Name -->
        <text x="415" y="175" 
              font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" 
              fill="#94A3B8" letter-spacing="1.2" text-anchor="middle"
              class="fade-in-text delay-3">
            Prepared by <tspan fill="#FCD34D" font-weight="600">Sarthak</tspan>
        </text>

        <!-- Decorative Code Brackets -->
        <text x="70" y="145" font-family="Courier, monospace" font-size="48" font-weight="bold" fill="#312E81" opacity="0.6" class="float-element">{</text>
        <text x="730" y="145" font-family="Courier, monospace" font-size="48" font-weight="bold" fill="#312E81" opacity="0.6" class="float-element">}</text>
    </g>
</svg>
